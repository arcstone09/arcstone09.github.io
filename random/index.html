<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="100개의 0과 1로 만드는 무작위. Bernoulli 모형과 비교하는 키보드 게임.">
  <title>Binary Lab — How random are you?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23c4f578'/%3E%3Ctext x='8' y='44' font-size='38' font-family='monospace'%3E01%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Binary Lab 홈"><span class="brand-icon" aria-hidden="true">01</span>Binary Lab</a>
    <button class="text-button" id="reference-button">게임 개발 참고</button>
  </header>
  <main>
    <section class="intro">
      <h1 lang="en">How random are you?</h1>
      <p>시간 안에 100개의 0과 1을 입력하고, 무작위 모형과 비교해 보세요.</p>
    </section>
    <div class="workspace">
      <aside class="setup-panel" aria-labelledby="setup-heading">
        <h2 id="setup-heading">게임 설정</h2>
        <form id="settings" novalidate>
          <div class="setting-group">
            <label for="probability">1이 나올 확률 <span class="mono">p</span></label>
            <div class="number-field"><input id="probability" type="number" min="0" max="1" step="any" value="0.5" inputmode="decimal" required aria-describedby="probability-help"></div>
            <div class="presets" aria-label="확률 빠른 설정"><button type="button" data-p="0.2" aria-pressed="false">0.2</button><button type="button" data-p="0.5" class="selected" aria-pressed="true">0.5</button><button type="button" data-p="0.8" aria-pressed="false">0.8</button></div>
            <p class="field-help" id="probability-help">0 &lt; p &lt; 1 · 기대되는 1: <span id="expected-ones">50</span>개</p>
          </div>
          <div class="setting-group">
            <label for="duration">제한시간</label>
            <div class="number-field"><input id="duration" type="number" min="1" max="600" step="1" value="45" inputmode="numeric" required aria-describedby="duration-help"><span>초</span></div>
            <p class="field-help" id="duration-help">1~600초 사이에서 설정하세요.</p>
          </div>
          <div class="start-group">
            <div class="calibration-state" id="calibration-state" role="status">준비 중…</div>
            <p id="validation" class="error" role="alert"></p>
            <button class="start-button" id="start" type="submit" disabled>시작하기 <kbd>Enter</kbd></button>
            <p class="field-help start-help" id="enter-hint">100개를 입력하면 바로 종료됩니다.</p>
          </div>
        </form>
      </aside>
      <section class="game-panel" aria-label="0과 1 입력">
        <div class="panel-heading"><span id="model-label">Bernoulli(p = 0.5)</span><span id="phase" role="status">시작 전</span></div>
        <div class="readouts">
          <div><span class="field-label">남은 시간</span><div class="timer" id="timer">45<span>.0</span><small>초</small></div></div>
          <div class="count-block"><span class="field-label">입력한 비트</span><div class="bit-count"><span id="count">0</span><span> / 100</span></div></div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="입력 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="progress-fill"></div></div>
        <div class="sequence-grid" id="sequence" aria-label="입력한 이진 수열"></div>
        <p class="input-hint" id="input-hint">시작한 뒤 0과 1을 입력하세요.</p>
        <div class="keypad">
          <button class="bit-key" id="zero" disabled aria-label="0 입력"><span>0</span></button>
          <button class="bit-key" id="one" disabled aria-label="1 입력"><span>1</span></button>
        </div>
        <div class="keyboard-help"><span><kbd>0</kbd> <kbd>1</kbd> 키보드 또는 버튼으로 입력</span><button class="text-button" id="delete" disabled><kbd>⌫</kbd> 마지막 입력 삭제</button></div>
      </section>
    </div>
    <section id="results" class="results" hidden aria-labelledby="result-heading" tabindex="-1"></section>
    <footer>Bernoulli(p) 모형과 비교하는 100-bit 게임</footer>
  </main>
  <dialog id="reference" aria-labelledby="reference-title">
    <div class="dialog-header"><h2 id="reference-title">게임 개발 참고</h2><button id="close-reference" class="close-button" aria-label="설명 닫기">닫기</button></div>
    <div id="reference-content"></div>
  </dialog>
</body>
</html>
