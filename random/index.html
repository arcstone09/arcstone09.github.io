<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="Binary Lab — compare your binary sequence with an independent Bernoulli model.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://arcstone09-random.basket032402.chatgpt.site; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://arcstone09-random.basket032402.chatgpt.site; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Binary Lab — Can You Fake Random?</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23c4f578'/%3E%3Ctext x='8' y='44' font-size='38' font-family='monospace'%3E01%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="" aria-label="Binary Lab"><span class="brand-icon" aria-hidden="true">01</span>Binary Lab</a>
    <div class="top-actions">
      <div class="segmented compact" role="group" data-label="language">
        <button type="button" data-language="ko" lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-language="en" lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="segmented compact" role="group" data-label="theme">
        <button type="button" data-theme="dark" aria-pressed="true"><span aria-hidden="true">◐</span> <span data-i18n="dark"></span></button>
        <button type="button" data-theme="light" aria-pressed="false"><span aria-hidden="true">☼</span> <span data-i18n="light"></span></button>
      </div>
      <button class="text-button reference-link" id="reference-button" data-i18n="reference"></button>
    </div>
  </header>
  <main>
    <section class="intro"><h1 lang="en">Can You Fake Random?</h1><p data-i18n="intro"></p></section>
    <p id="challenge-banner" class="challenge-banner" hidden></p>
    <div class="workspace">
      <aside class="setup-panel" aria-labelledby="setup-heading">
        <h2 id="setup-heading" data-i18n="setup"></h2>
        <form id="settings" novalidate>
          <div class="segmented mode-switch" role="group" data-label="mode">
            <button type="button" data-mode="practice" aria-pressed="true" data-i18n="practice"></button>
            <button type="button" data-mode="ranking" aria-pressed="false" data-i18n="ranked"></button>
          </div>
          <p class="field-help mode-help" id="mode-help"></p>
          <div class="setting-group probability-group">
            <label for="probability"><span data-i18n="probability"></span><span class="mono">p</span></label>
            <div class="number-field"><input id="probability" type="number" min="0" max="1" step="any" value="0.5" inputmode="decimal" required aria-describedby="probability-help"></div>
            <div class="presets segmented" role="group" data-label="presets">
              <button type="button" data-p="0.2" aria-pressed="false">0.2</button><button type="button" data-p="0.5" aria-pressed="true">0.5</button><button type="button" data-p="0.8" aria-pressed="false">0.8</button>
            </div>
            <p class="field-help" id="probability-help"></p>
          </div>
          <div class="setting-group">
            <label for="sequence-length" data-i18n="length"></label>
            <div class="number-field"><input id="sequence-length" type="number" min="1" max="1000" step="1" value="100" inputmode="numeric" required aria-describedby="length-help"><span>bits</span></div>
            <p class="field-help" id="length-help" data-i18n="lengthHelp"></p>
          </div>
          <div class="setting-group">
            <label for="duration" data-i18n="duration"></label>
            <div class="number-field"><input id="duration" type="number" min="1" max="600" step="1" value="45" inputmode="numeric" required aria-describedby="duration-help"><span data-i18n="seconds"></span></div>
            <p class="field-help" id="duration-help" data-i18n="durationHelp"></p>
          </div>
          <div class="start-group">
            <div class="calibration-state" id="calibration-state" role="status"></div>
            <p id="validation" class="error" role="alert"></p>
            <button class="start-button" id="start" type="submit" disabled></button>
            <p class="field-help" id="enter-hint"></p>
          </div>
        </form>
      </aside>
      <section class="game-panel" data-label="game">
        <div class="panel-heading"><span id="model-label"></span><span id="phase" role="status"></span></div>
        <div class="readouts">
          <div><span class="field-label" data-i18n="timeLeft"></span><div class="timer" id="timer"></div></div>
          <div class="count-block"><span class="field-label" data-i18n="entered"></span><div class="bit-count"><span id="count">0</span><span id="target-count"> / 100</span></div></div>
        </div>
        <div class="progress-track" role="progressbar" data-label="progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="progress-fill"></div></div>
        <div class="sequence-grid" id="sequence" tabindex="0" data-label="sequence"></div>
        <p class="input-hint" id="input-hint"></p>
        <div class="keypad"><button class="bit-key" id="zero" disabled data-label="inputZero">0</button><button class="bit-key" id="one" disabled data-label="inputOne">1</button></div>
        <div class="keyboard-help"><span><kbd>0</kbd> <kbd>1</kbd> <span data-i18n="keyHelp"></span></span><button class="text-button" id="delete" disabled><kbd>⌫</kbd> <span data-i18n="delete"></span></button></div>
        <div class="paste-area">
          <label for="paste-input" data-i18n="pasteTitle"></label>
          <textarea id="paste-input" rows="4" disabled data-placeholder="pastePlaceholder" aria-describedby="paste-help" spellcheck="false"></textarea>
          <div class="paste-toolbar"><p class="field-help" id="paste-help" data-i18n="pasteHelp"></p><button type="button" class="secondary-button" id="apply-paste" disabled data-i18n="applyPaste"></button></div>
          <details class="example-details"><summary data-i18n="exampleTitle"></summary><p data-i18n="exampleHelp"></p><div class="code-block"><code id="example-sequence"></code><button type="button" class="copy-button" data-copy data-label="copy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span data-i18n="copy"></span></button></div></details>
        </div>
      </section>
    </div>
    <section id="results" class="results" hidden aria-labelledby="result-heading" tabindex="-1"></section>
    <section class="leaderboard" id="leaderboard" aria-labelledby="leaderboard-heading">
      <div class="section-heading"><div><h2 id="leaderboard-heading" data-i18n="leaderboard"></h2><p class="field-help" data-i18n="rankRules"></p></div><button class="secondary-button" id="refresh-ranking" data-i18n="refresh"></button></div>
      <div class="segmented period-tabs" role="group" data-label="period">
        <button data-period="24h" aria-pressed="true" data-i18n="day"></button><button data-period="week" aria-pressed="false" data-i18n="week"></button><button data-period="month" aria-pressed="false" data-i18n="month"></button><button data-period="all" aria-pressed="false" data-i18n="all"></button>
      </div>
      <p id="ranking-status" class="field-help" role="status"></p>
      <div class="table-wrap"><table class="ranking-table"><thead><tr><th data-i18n="rank"></th><th data-i18n="username"></th><th data-i18n="score"></th><th data-i18n="recorded"></th></tr></thead><tbody id="leaderboard-list"></tbody></table></div>
      <p class="field-help" data-i18n="rankingHelp"></p>
    </section>
    <footer data-i18n="footer"></footer>
  </main>
  <dialog id="reference" aria-labelledby="reference-title"><div class="dialog-header"><h2 id="reference-title" data-i18n="reference"></h2><button id="close-reference" class="secondary-button" data-i18n="close"></button></div><div id="reference-content"></div></dialog>
  <dialog id="account" aria-labelledby="account-title"><div class="dialog-header"><h2 id="account-title" data-i18n="accountTitle"></h2><button id="close-account" class="secondary-button" data-i18n="close"></button></div>
    
  </dialog>
  <dialog id="security" aria-labelledby="security-title"><div class="dialog-header"><h2 id="security-title" data-i18n="securityTitle"></h2><button id="close-security" class="secondary-button" data-i18n="close"></button></div>
    
  </dialog>
  <dialog id="recovery-display" aria-labelledby="recovery-title"><h2 id="recovery-title" data-i18n="recoveryCode"></h2><p data-i18n="saveRecovery"></p><div class="code-block"><code id="issued-code"></code></div><button id="copy-recovery" class="secondary-button" data-i18n="copy"></button><button id="close-recovery" class="start-button" data-i18n="savedRecovery"></button></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
